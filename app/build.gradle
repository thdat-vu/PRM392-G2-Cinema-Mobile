plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.g2.moviebooking'
    compileSdk 35

    defaultConfig {
        applicationId "com.g2.moviebooking"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // Zalo Pay
    implementation fileTree(
            dir: 'D:\\Bi\\FPT\\Sem8\\PRM392\\Final_Project\\ZaloPayLib',
            include: ['*.aar', '*.jar'],
            exclude: [''])
    implementation("com.squareup.okhttp3:okhttp:4.6.0")
    implementation("commons-codec:commons-codec:1.14")

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation platform('com.google.firebase:firebase-bom:33.10.0')

    // https://mvnrepository.com/artifact/com.google.firebase/firebase-auth
    implementation 'com.google.firebase:firebase-auth'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // Gọi API
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' // Parse JSON

    // https://mvnrepository.com/artifact/com.google.android.gms/play-services-auth
    implementation 'com.google.android.gms:play-services-auth:21.3.0'


    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}